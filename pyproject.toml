[project]
name = "iamed-harness"
version = "0.1.0"
description = "Harness minimo e auditavel para avaliar LLMs em tarefas clinicas de multipla escolha"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fabiano Filho" }]
dependencies = [
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[project.scripts]
harness = "iamed_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iamed_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"scripts/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
# O strict vale para src/, que e o codigo que os outros importam. Testes e
# scripts tambem sao checados, mas por `make lint`, sem exigir anotacao em cada
# funcao: `def test_ece_bate()` nao ganha nada com `-> None`.
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
